aid: fermat
name: Fermat
description: FERMÀT is an AI-native commerce platform that consolidates the shopper analytics, personalization,
  and experimentation stack into a single agentic system for direct-to-consumer and enterprise brands.
  It runs a closed loop — detect shopper behavior, recommend revenue-optimizing actions, generate adaptive
  storefront experiences and product pages, then feed performance signals back into detection — replacing
  tools like FullStory, Amplitude, Algolia, and Optimizely. FERMÀT integrates with ecommerce platforms
  including Shopify Plus, Salesforce Commerce Cloud, Adobe Commerce, and Oracle ATG via batch and streaming
  data syncs, and serves brands such as Glossier, GNC, Backcountry, AWAY, Travelpro, and TONAL. Surfaced
  as a portfolio company of Bain Capital Ventures, Greylock, and QED Investors.
