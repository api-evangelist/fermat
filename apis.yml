apis:
- name: FERMAT Platform MCP Server
  description: 'Remote Model Context Protocol server exposing 64 read-only tools over FERMAT commerce
    data — product catalog, funnel analytics, ad performance, destination insights, experiments, session
    and behavioral data, anomaly and friction detection, branding, offers, bundles, product pages, and
    Pierre, FERMAT''s natural-language BI agent. Streamable HTTP (POST only), protected by OAuth 2.1 authorization-code
    + PKCE with dynamic client registration. Customer-only: an anonymous tools/list returns JSON-RPC -32001.
    External access is read-only; the provider states write capability is coming.'
  humanURL: https://help.fermatcommerce.com/en/articles/14431099-fermat-mcp-connect-your-commerce-data-to-ai-tools
  baseURL: https://mcp.fermatcommerce.com/mcp/fermat-mcp
