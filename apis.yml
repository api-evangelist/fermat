- name: FERMAT Pixel v2
  description: First-party browser ES module (claire.mjs) a brand embeds to emit commerce telemetry to
    FERMAT. Exposes a window.fermat command queue with init, track and status methods, and six documented
    events — page_view, view_product, add_to_cart, remove_from_cart, begin_checkout and purchase — each
    with a published field schema. Lazily loads a session recorder for replay, heatmaps and scroll-depth
    analysis when recording is enabled in the pixel config. Installed via a direct script tag or Google
    Tag Manager; Shopify stores use a separate native path.
  humanURL: https://help.fermatcommerce.com/en/articles/14280269-fermat-pixel-v2-installation-guide-direct-script-google-tag-manager
  baseURL: https://e.clairedefermat.com
